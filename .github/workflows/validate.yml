name: Validate plugins
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/package.py --check --zip
      - uses: actions/upload-artifact@v4
        with:
          name: ponko-plugin
          path: dist/*.zip
